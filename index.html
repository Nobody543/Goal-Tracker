<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Goals Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .date-display {
      font-size: 16px;
      opacity: 0.9;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .nav-tab {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav-tab.active {
      background: white;
      color: #667eea;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #1a202c;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"], textarea {
      flex: 1;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
    }

    .btn {
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #5568d3;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-small {
      padding: 6px 12px;
      font-size: 13px;
    }

    .btn-danger {
      background: #ef4444;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .goal-item, .task-item, .note-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.3s ease;
    }

    .goal-item:hover, .task-item:hover, .note-item:hover {
      background: #edf2f7;
    }

    .goal-item.completed {
      opacity: 0.6;
    }

    .goal-item.completed .goal-text {
      text-decoration: line-through;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .goal-text, .task-text {
      flex: 1;
      font-size: 15px;
      color: #2d3748;
    }

    .delete-btn {
      padding: 6px 10px;
      background: #fee;
      color: #dc2626;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
      border-radius: 12px;
      color: white;
      text-align: center;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      opacity: 0.9;
    }

    .period-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .period-btn {
      padding: 8px 16px;
      background: #edf2f7;
      color: #4a5568;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .period-btn.active {
      background: #667eea;
      color: white;
    }

    .history-item {
      padding: 12px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 8px;
      border-left: 4px solid #667eea;
    }

    .history-date {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 4px;
    }

    .history-stats {
      font-size: 14px;
      color: #4a5568;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .recurring-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .date-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #fef3c7;
      color: #92400e;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .note-meta {
      font-size: 12px;
      color: #718096;
      margin-bottom: 8px;
    }

    .note-content {
      font-size: 14px;
      color: #2d3748;
      line-height: 1.6;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Daily Goals Tracker</h1>
      <div class="date-display" id="currentDate"></div>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchPage('today')">Today</button>
      <button class="nav-tab" onclick="switchPage('recurring')">Recurring Tasks</button>
      <button class="nav-tab" onclick="switchPage('stats')">Statistics</button>
      <button class="nav-tab" onclick="switchPage('notes')">Notes</button>
    </div>

    <div id="todayPage" class="page active">
      <div class="card">
        <h2>Daily Goals</h2>
        <div class="input-group">
          <input type="text" id="goalInput" placeholder="Add a goal for today...">
          <button class="btn" onclick="addGoal()">Add</button>
        </div>
        <div id="goalsList"></div>
      </div>

      <div class="card">
        <h2>Today's Recurring Tasks</h2>
        <div id="recurringTasksList"></div>
      </div>

      <div class="card">
        <h2>Plan for Tomorrow</h2>
        <div class="input-group">
          <input type="text" id="tomorrowGoalInput" placeholder="Add a goal for tomorrow...">
          <button class="btn" onclick="addTomorrowGoal()">Add</button>
        </div>
        <div id="tomorrowGoalsList"></div>
      </div>
    </div>

    <div id="recurringPage" class="page">
      <div class="card">
        <h2>Recurring Tasks</h2>
        <div class="input-group">
          <input type="text" id="recurringTaskInput" placeholder="E.g., Meditate for 10 mins">
          <button class="btn" onclick="addRecurringTask()">Add Daily Task</button>
        </div>
        <div id="recurringTasksManager"></div>
      </div>
    </div>

    <div id="statsPage" class="page">
      <div class="card">
        <h2>Your Progress</h2>
        <div class="period-selector">
          <button class="period-btn active" onclick="updateStats('week')">Week</button>
          <button class="period-btn" onclick="updateStats('month')">Month</button>
          <button class="period-btn" onclick="updateStats('year')">Year</button>
          <button class="period-btn" onclick="updateStats('all')">All Time</button>
        </div>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="statTotalGoals">0</div>
            <div class="stat-label">Total Goals</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statCompleted">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statCompletionRate">0%</div>
            <div class="stat-label">Completion Rate</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statStreak">0</div>
            <div class="stat-label">Day Streak</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>History</h2>
        <div id="historyList"></div>
      </div>
    </div>

    <div id="notesPage" class="page">
      <div class="card">
        <h2>Daily Notes</h2>
        <textarea id="noteInput" placeholder="Write your thoughts, reflections, or notes for today..."></textarea>
        <button class="btn" onclick="saveNote()" style="margin-top: 12px; width: 100%;">Save Note</button>
      </div>

      <div class="card">
        <h2>Past Notes</h2>
        <div id="notesList"></div>
      </div>
    </div>
  </div>

  <script>
    const DATA_KEY = 'dailyGoalsTrackerData';
    let data = {
      goals: {},
      recurringTasks: [],
      notes: {},
      tomorrowGoals: []
    };

    function loadData() {
      const stored = localStorage.getItem(DATA_KEY);
      if (stored) {
        data = JSON.parse(stored);
      }
    }

    function saveData() {
      localStorage.setItem(DATA_KEY, JSON.stringify(data));
    }

    function getToday() {
      return new Date().toISOString().split('T')[0];
    }

    function getTomorrow() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      return tomorrow.toISOString().split('T')[0];
    }

    function formatDate(dateString) {
      const date = new Date(dateString + 'T12:00:00');
      return date.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function updateCurrentDate() {
      document.getElementById('currentDate').textContent = formatDate(getToday());
    }

    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      
      if (page === 'today') {
        document.getElementById('todayPage').classList.add('active');
        document.querySelector('.nav-tab:nth-child(1)').classList.add('active');
        renderGoals();
        renderRecurringTasksForToday();
        renderTomorrowGoals();
      } else if (page === 'recurring') {
        document.getElementById('recurringPage').classList.add('active');
        document.querySelector('.nav-tab:nth-child(2)').classList.add('active');
        renderRecurringTasksManager();
      } else if (page === 'stats') {
        document.getElementById('statsPage').classList.add('active');
        document.querySelector('.nav-tab:nth-child(3)').classList.add('active');
        updateStats('week');
      } else if (page === 'notes') {
        document.getElementById('notesPage').classList.add('active');
        document.querySelector('.nav-tab:nth-child(4)').classList.add('active');
        loadTodayNote();
        renderNotesList();
      }
    }

    function addGoal() {
      const input = document.getElementById('goalInput');
      const text = input.value.trim();
      if (!text) return;

      const today = getToday();
      if (!data.goals[today]) {
        data.goals[today] = [];
      }

      data.goals[today].push({
        id: Date.now(),
        text: text,
        completed: false,
        createdAt: new Date().toISOString()
      });

      input.value = '';
      saveData();
      renderGoals();
    }

    function toggleGoal(date, id) {
      const goal = data.goals[date].find(g => g.id === id);
      if (goal) {
        goal.completed = !goal.completed;
        saveData();
        renderGoals();
      }
    }

    function deleteGoal(date, id) {
      data.goals[date] = data.goals[date].filter(g => g.id !== id);
      saveData();
      renderGoals();
    }

    function renderGoals() {
      const today = getToday();
      const container = document.getElementById('goalsList');
      
      if (!data.goals[today] || data.goals[today].length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🎯</div><div>No goals for today yet. Add one above!</div></div>';
        return;
      }

      container.innerHTML = data.goals[today].map(goal => `
        <div class="goal-item ${goal.completed ? 'completed' : ''}">
          <input type="checkbox" class="checkbox" ${goal.completed ? 'checked' : ''} 
                 onchange="toggleGoal('${today}', ${goal.id})">
          <div class="goal-text">${goal.text}</div>
          <button class="delete-btn" onclick="deleteGoal('${today}', ${goal.id})">Delete</button>
        </div>
      `).join('');
    }

    function addRecurringTask() {
      const input = document.getElementById('recurringTaskInput');
      const text = input.value.trim();
      if (!text) return;

      data.recurringTasks.push({
        id: Date.now(),
        text: text,
        createdAt: new Date().toISOString()
      });

      input.value = '';
      saveData();
      renderRecurringTasksManager();
      renderRecurringTasksForToday();
    }

    function deleteRecurringTask(id) {
      data.recurringTasks = data.recurringTasks.filter(t => t.id !== id);
      saveData();
      renderRecurringTasksManager();
      renderRecurringTasksForToday();
    }

    function renderRecurringTasksManager() {
      const container = document.getElementById('recurringTasksManager');
      
      if (data.recurringTasks.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div>No recurring tasks yet. Add daily tasks above!</div></div>';
        return;
      }

      container.innerHTML = data.recurringTasks.map(task => `
        <div class="task-item">
          <div class="task-text">
            <span class="recurring-badge">DAILY</span> ${task.text}
          </div>
          <button class="delete-btn" onclick="deleteRecurringTask(${task.id})">Delete</button>
        </div>
      `).join('');
    }

    function toggleRecurringTask(taskId) {
      const today = getToday();
      if (!data.goals[today]) {
        data.goals[today] = [];
      }

      const existingIndex = data.goals[today].findIndex(g => g.recurringTaskId === taskId);
      if (existingIndex >= 0) {
        data.goals[today][existingIndex].completed = !data.goals[today][existingIndex].completed;
      } else {
        const task = data.recurringTasks.find(t => t.id === taskId);
        if (task) {
          data.goals[today].push({
            id: Date.now(),
            text: task.text,
            completed: true,
            recurringTaskId: taskId,
            createdAt: new Date().toISOString()
          });
        }
      }

      saveData();
      renderRecurringTasksForToday();
    }

    function renderRecurringTasksForToday() {
      const container = document.getElementById('recurringTasksList');
      const today = getToday();

      if (data.recurringTasks.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✨</div><div>No recurring tasks set up yet.</div></div>';
        return;
      }

      container.innerHTML = data.recurringTasks.map(task => {
        const existingGoal = data.goals[today]?.find(g => g.recurringTaskId === task.id);
        const completed = existingGoal?.completed || false;

        return `
          <div class="goal-item ${completed ? 'completed' : ''}">
            <input type="checkbox" class="checkbox" ${completed ? 'checked' : ''} 
                   onchange="toggleRecurringTask(${task.id})">
            <div class="goal-text">${task.text}</div>
          </div>
        `;
      }).join('');
    }

    function addTomorrowGoal() {
      const input = document.getElementById('tomorrowGoalInput');
      const text = input.value.trim();
      if (!text) return;

      data.tomorrowGoals.push({
        id: Date.now(),
        text: text,
        createdAt: new Date().toISOString()
      });

      input.value = '';
      saveData();
      renderTomorrowGoals();
    }

    function deleteTomorrowGoal(id) {
      data.tomorrowGoals = data.tomorrowGoals.filter(g => g.id !== id);
      saveData();
      renderTomorrowGoals();
    }

    function renderTomorrowGoals() {
      const container = document.getElementById('tomorrowGoalsList');
      
      if (data.tomorrowGoals.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><div>No goals planned for tomorrow yet.</div></div>';
        return;
      }

      container.innerHTML = data.tomorrowGoals.map(goal => `
        <div class="goal-item">
          <div class="goal-text">
            <span class="date-badge">TOMORROW</span> ${goal.text}
          </div>
          <button class="delete-btn" onclick="deleteTomorrowGoal(${goal.id})">Delete</button>
        </div>
      `).join('');
    }

    function moveTomorrowGoalsToToday() {
      const today = getToday();
      if (!data.goals[today]) {
        data.goals[today] = [];
      }

      data.tomorrowGoals.forEach(goal => {
        data.goals[today].push({
          id: Date.now() + Math.random(),
          text: goal.text,
          completed: false,
          createdAt: new Date().toISOString()
        });
      });

      data.tomorrowGoals = [];
      saveData();
    }

    function updateStats(period) {
      document.querySelectorAll('.period-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const now = new Date();
      const cutoffDate = new Date();
      
      if (period === 'week') {
        cutoffDate.setDate(now.getDate() - 7);
      } else if (period === 'month') {
        cutoffDate.setMonth(now.getMonth() - 1);
      } else if (period === 'year') {
        cutoffDate.setFullYear(now.getFullYear() - 1);
      } else {
        cutoffDate.setFullYear(2000);
      }

      let totalGoals = 0;
      let completedGoals = 0;
      let daysWithGoals = new Set();

      Object.entries(data.goals).forEach(([date, goals]) => {
        const goalDate = new Date(date + 'T12:00:00');
        if (goalDate >= cutoffDate) {
          totalGoals += goals.length;
          completedGoals += goals.filter(g => g.completed).length;
          if (goals.length > 0) {
            daysWithGoals.add(date);
          }
        }
      });

      const completionRate = totalGoals > 0 ? Math.round((completedGoals / totalGoals) * 100) : 0;
      const streak = calculateStreak();

      document.getElementById('statTotalGoals').textContent = totalGoals;
      document.getElementById('statCompleted').textContent = completedGoals;
      document.getElementById('statCompletionRate').textContent = completionRate + '%';
      document.getElementById('statStreak').textContent = streak;

      renderHistory(period);
    }

    function calculateStreak() {
      const today = new Date();
      let streak = 0;
      let currentDate = new Date(today);

      while (true) {
        const dateStr = currentDate.toISOString().split('T')[0];
        const dayGoals = data.goals[dateStr];
        
        if (!dayGoals || dayGoals.length === 0) {
          break;
        }

        const hasCompletedGoal = dayGoals.some(g => g.completed);
        if (!hasCompletedGoal) {
          break;
        }

        streak++;
        currentDate.setDate(currentDate.getDate() - 1);
      }

      return streak;
    }

    function renderHistory(period) {
      const container = document.getElementById('historyList');
      const now = new Date();
      const cutoffDate = new Date();
      
      if (period === 'week') {
        cutoffDate.setDate(now.getDate() - 7);
      } else if (period === 'month') {
        cutoffDate.setMonth(now.getMonth() - 1);
      } else if (period === 'year') {
        cutoffDate.setFullYear(now.getFullYear() - 1);
      } else {
        cutoffDate.setFullYear(2000);
      }

      const filteredDates = Object.entries(data.goals)
        .filter(([date]) => {
          const goalDate = new Date(date + 'T12:00:00');
          return goalDate >= cutoffDate;
        })
        .sort((a, b) => b[0].localeCompare(a[0]));

      if (filteredDates.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div>No history for this period yet.</div></div>';
        return;
      }

      container.innerHTML = filteredDates.map(([date, goals]) => {
        const completed = goals.filter(g => g.completed).length;
        const total = goals.length;
        const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

        return `
          <div class="history-item">
            <div class="history-date">${formatDate(date)}</div>
            <div class="history-stats">
              ${completed} of ${total} goals completed (${rate}%)
            </div>
          </div>
        `;
      }).join('');
    }

    function saveNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      const today = getToday();
      data.notes[today] = {
        text: text,
        timestamp: new Date().toISOString()
      };

      input.value = '';
      saveData();
      renderNotesList();
      alert('Note saved for today!');
    }

    function loadTodayNote() {
      const today = getToday();
      const input = document.getElementById('noteInput');
      
      if (data.notes[today]) {
        input.value = data.notes[today].text;
      } else {
        input.value = '';
      }
    }

    function deleteNote(date) {
      if (confirm('Are you sure you want to delete this note?')) {
        delete data.notes[date];
        saveData();
        renderNotesList();
        loadTodayNote();
      }
    }

    function renderNotesList() {
      const container = document.getElementById('notesList');
      
      const sortedNotes = Object.entries(data.notes)
        .sort((a, b) => b[0].localeCompare(a[0]));

      if (sortedNotes.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📝</div><div>No notes saved yet.</div></div>';
        return;
      }

      container.innerHTML = sortedNotes.map(([date, note]) => `
        <div class="note-item">
          <div class="note-meta">
            ${formatDate(date)}
            <button class="delete-btn" onclick="deleteNote('${date}')" style="float: right;">Delete</button>
          </div>
          <div class="note-content">${note.text}</div>
        </div>
      `).join('');
    }

    function checkNewDay() {
      const lastVisit = localStorage.getItem('lastVisitDate');
      const today = getToday();

      if (lastVisit !== today) {
        moveTomorrowGoalsToToday();
        localStorage.setItem('lastVisitDate', today);
      }
    }

    loadData();
    updateCurrentDate();
    checkNewDay();
    renderGoals();
    renderRecurringTasksForToday();
    renderTomorrowGoals();

    document.getElementById('goalInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addGoal();
    });

    document.getElementById('recurringTaskInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addRecurringTask();
    });

    document.getElementById('tomorrowGoalInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTomorrowGoal();
    });
  </script>
</body>
