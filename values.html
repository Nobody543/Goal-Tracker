<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Value Ranking Tool</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 20px;
}

h1 { text-align: center; }

#list {
  max-width: 600px;
  margin: auto;
}

.item {
  background: white;
  margin: 6px 0;
  padding: 12px;
  border-radius: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  touch-action: none;
}

.item.top10 {
  background: #e6f2ff;
}

.dragging {
  opacity: 0.5;
}

.buttons button {
  margin-left: 5px;
}

.divider {
  height: 2px;
  background: #007bff;
  margin: 10px 0;
}

/* Modal */
#modal {
  display: none;
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.6);
}

#modal-content {
  background:white;
  padding:20px;
  margin:10% auto;
  width:400px;
  border-radius:10px;
}

#close { float:right; cursor:pointer; }
</style>
</head>

<body>

<h1>Rank Your Values</h1>
<p style="text-align:center;">Drag to reorder, or use arrows. Tap a value to learn more.</p>

<div id="list"></div>

<!-- Modal -->
<div id="modal">
  <div id="modal-content">
    <span id="close">X</span>
    <h2 id="title"></h2>
    <p id="desc"></p>
  </div>
</div>

<script>
const values = [
{name:"Kindness",desc:"Choosing to improve another person’s experience through your actions, especially when they don't deserve it."},
{name:"Fairness",desc:"Ensuring starting conditions and rules do not advantage one person over another."},
{name:"Honesty",desc:"Communicating what you believe to be true without distortion."},
{name:"Integrity",desc:"Acting consistently with your principles in spite of what others may feel/encourage."},
{name:"Discipline",desc:"Following through regardless of mood."},
{name:"Ambition",desc:"A strong drive to achieve high outcomes, often seen to be at first unachievable."},
{name:"Curiosity",desc:"A desire to explore and understand the unknown"},
{name:"Creativity",desc:"Producing often novel and unexpected ideas that are new and useful."},
{name:"Courage",desc:"Acting in spite of fear."},
{name:"Compassion",desc:"Recognising and feeling the suffering of others."},
{name:"Respect",desc:"Treating others as having inherent worth."},
{name:"Loyalty",desc:"Remaining committed to somebody even during their worst trials."},
{name:"Freedom",desc:"Having control over your actions."},
{name:"Forethought",desc:"Making decisions with long-term awareness."},
{name:"Gratitude",desc:"Valuing what you have."},
{name:"Humility",desc:"Maintaining an accurate view of yourself. You are no better than others and should be treated as such."},
{name:"Confidence",desc:"Trust in your ability."},
{name:"Patience",desc:"Remaining steady through long trials."},
{name:"Perseverance",desc:"Continuing in spite of difficulty."},
{name:"Growth",desc:"Pushing yourself to develop as a human being."},
{name:"Authenticity",desc:"Expressing your true self, not what others want or expect to see."},
{name:"Generosity",desc:"Giving without expecting return."},
{name:"Adventurousness",desc:"Taking risks, exploring the unknown, and gaining new experiences along the way."},
{name:"Excellence",desc:"Pursuing the highest quality."},
{name:"Openness",desc:"Being happy to exploring new paths, ideas, and experiences you know nothing of."},
{name:"Spontaneity",desc:"Acting without planning."},
{name:"Leadership",desc:"Helping to guide others."},
{name:"Service",desc:"Helping others through action."},
{name:"Community",desc:"Valuing connections with other human beings."},
{name:"Stability",desc:"Maintaining consistency in your actions and emotions, rather than changing state rapidly without much though."},
{name:"Self-respect",desc:"Holding yourself to standards."},
{name:"Accountability",desc:"Accepting the consequences of your actions."},
{name:"Adaptability",desc:"Adjusting to change."},
{name:"Forgiveness",desc:"Releasing resentment."},
{name:"Trust",desc:"Relying on others."},
{name:"Trust",desc:"Loving yourself as you would a friend."}
];

const list = document.getElementById("list");
let dragIndex = null;

function render(){
  list.innerHTML = "";

  values.forEach((v,i)=>{
    const div = document.createElement("div");
    div.className = "item";
    if(i < 10) div.classList.add("top10");

    div.innerHTML = `
      <span onclick="showModal(${i})">${i+1}. ${v.name}</span>
      <div class="buttons">
        <button onclick="moveUp(${i})">↑</button>
        <button onclick="moveDown(${i})">↓</button>
      </div>
    `;

    // Touch drag
    div.addEventListener("pointerdown", ()=> {
      dragIndex = i;
      div.classList.add("dragging");
    });

    div.addEventListener("pointerenter", ()=>{
      if(dragIndex === null) return;
      const item = values.splice(dragIndex,1)[0];
      values.splice(i,0,item);
      dragIndex = i;
      render();
    });

    div.addEventListener("pointerup", ()=>{
      dragIndex = null;
      document.querySelectorAll(".item").forEach(el=>el.classList.remove("dragging"));
    });

    list.appendChild(div);

    if(i === 9){
      const line = document.createElement("div");
      line.className = "divider";
      list.appendChild(line);
    }
  });
}

function moveUp(i){
  if(i===0) return;
  [values[i],values[i-1]]=[values[i-1],values[i]];
  render();
}

function moveDown(i){
  if(i===values.length-1) return;
  [values[i],values[i+1]]=[values[i+1],values[i]];
  render();
}

// Modal
function showModal(i){
  document.getElementById("title").innerText = values[i].name;
  document.getElementById("desc").innerText = values[i].desc;
  document.getElementById("modal").style.display = "block";
}

document.getElementById("close").onclick = ()=>{
  document.getElementById("modal").style.display = "none";
};

window.onclick = e=>{
  if(e.target.id==="modal"){
    document.getElementById("modal").style.display = "none";
  }
};

render();
</script>

</body>
</html>
